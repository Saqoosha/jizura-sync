<script>
  // Spotify rejects `localhost` redirect URIs (only the loopback IP is allowed), and tokens live
  // in the origin's storage -- so a page opened as localhost is moved to 127.0.0.1 first.
  if (location.hostname === 'localhost') location.replace(location.href.replace('//localhost', '//127.0.0.1'));
</script>

<canvas id="view"></canvas>

<div id="gate" hidden>
  <p class="wordmark">jizura-sync</p>
  <p class="lede" id="gateText">Lyric motion for what's playing on your Spotify</p>

  <form id="setup" hidden>
    <label for="clientId">Spotify Client ID</label>
    <input id="clientId" name="clientId" autocomplete="off" spellcheck="false" placeholder="32 hex characters" pattern="[0-9a-fA-F]{32}" required>
    <p class="hint">Register this exact Redirect URI on your Spotify app:</p>
    <code id="redirectUri"></code>
    <button type="submit">Save</button>
    <p class="hint"><a href="https://github.com/Saqoosha/jizura-sync#setup" target="_blank" rel="noopener">How to get a Client ID</a></p>
  </form>

  <button id="connect" type="button" hidden>Connect Spotify</button>
  <button id="changeClient" type="button" class="secondary" hidden>Change Client ID</button>
</div>

<button id="disconnect" type="button" class="secondary corner" hidden>Disconnect</button>

<div id="hud">
  <p id="track"></p>
  <p id="status"></p>
  <p id="keys">R restyle · K frame stepping · U unify · [ ] lyrics −/+50 ms · Space play/pause · F fullscreen</p>
</div>
